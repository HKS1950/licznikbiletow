name: Bilet Scraper

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Skonfiguruj Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Zainstaluj biblioteki
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Uruchom scraper
        run: python cron_scraper.py

      - name: Zapisz zaktualizowane dane na GitHubie
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          git add bilety_data.json
          git commit -m "Auto-update biletów przez ScraperAPI" || echo "Brak zmian"
          git push
