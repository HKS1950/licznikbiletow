name: Bilet Scraper

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Skonfiguruj Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Zainstaluj biblioteki i zależności Playwrighta
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Uruchom scraper
        run: |
          xvfb-run python cron_scraper.py

      - name: Zapisz zaktualizowane dane w repozytorium
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          git add bilety_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update danych o biletach" && git push)
